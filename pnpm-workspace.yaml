publicHoistPattern:
  - vitest
  - vite-node

shamefullyHoist: true
shellEmulator: true
trustPolicy: no-downgrade

packages:
  - docs
  - packages/*

catalogs:
  dev:
    '@antfu/eslint-config': ^7.7.3
    '@commitlint/cli': ^20.5.3
    '@commitlint/config-conventional': ^20.5.3
    bumpp: ^10.4.1
    eslint: ^9.39.5
    husky: ^9.1.7
    lint-staged: ^16.4.0
    typescript: ^5.9.3
    unbuild: ^3.6.1
  integrations:
    rabbitmq-client: ^5.1.0
  test:
    '@vitest/browser-playwright': ^4.1.12
    '@vitest/coverage-v8': ^4.1.12
    playwright: ^1.64.1
    vitest: ^4.1.12
  types:
    '@types/node': ^25.9.9

ignoredBuiltDependencies:
  - '@parcel/watcher'
  - esbuild

sideEffectsCache: false
strictPeerDependencies: false
